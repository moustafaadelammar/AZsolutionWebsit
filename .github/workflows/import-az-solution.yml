name: Import AZ Solution Website

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: git clone --depth 1 https://github.com/moustafaadelammar/github-progect.git /tmp/source

      - name: Replace repository contents with AZ Solution website
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -R /tmp/source/az-solution/. .

      - name: Commit imported website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import AZ Solution website' || exit 0
          git push origin main
